---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-or-untagged-images
  annotations:
    policies.kyverno.io/title: Disallow Latest or Untagged Images
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Images must specify a non-latest tag or a digest.
spec:
  background: true
  rules:
    - name: validate-image-references
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- with .Values.policies.disallowLatestTag.excludedNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml . | nindent 16 }}
      {{- end }}
      validate:
        failureAction: {{ .Values.policies.disallowLatestTag.failureAction }}
        message: Images must specify a non-latest tag or a digest.
        foreach:
          - list: 'request.object.spec.[containers, initContainers, ephemeralContainers][] | [?image != null]'
            deny:
              conditions:
                all:
                  - key: "{{ "{{" }} element.image {{ "}}" }}"
                    operator: Matches
                    value: "(^|/)[^/:]+(:latest)?$"
