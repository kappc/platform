---
sameNamespace:
  - argocd
  - cert-manager
  - cnpg-system
  - crossplane-system
  - envoy-gateway-system
  - external-secrets
  - kyverno
  - metallb-system
  - monitoring
  - openbao
  - policy-reporter
  - reloader

allowRules:
  - name: envoy-proxy-from-world
    to:
      namespace: envoy-gateway-system
      podLabels:
        app.kubernetes.io/name: envoy
        app.kubernetes.io/component: proxy
    fromEntities:
      - world
    ports:
      - "10080"
      - "10443"
  - name: grafana-from-gateway
    to:
      namespace: monitoring
      podLabels:
        app.kubernetes.io/name: grafana
    fromNamespaces:
      - envoy-gateway-system
    ports:
      - "3000"
  - name: openbao-from-external-secrets
    to:
      namespace: openbao
      podLabels:
        app.kubernetes.io/name: openbao
    fromNamespaces:
      - external-secrets
    ports:
      - "8200"
