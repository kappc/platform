---
application: kyverno
argocd:
  name: kyverno
  project: platform
  rolloutGroup: infrastructure
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - 'select(.metadata.name | endswith(".policies.kyverno.io")) | .spec.conversion'
        - >-
          select(.metadata.name | endswith(".policies.kyverno.io"))
          | select(.metadata.labels == {}) | .metadata.labels
        - >-
          select(.metadata.name | endswith(".policies.kyverno.io"))
          | select(.metadata.annotations == {}) | .metadata.annotations
namespace: kyverno
