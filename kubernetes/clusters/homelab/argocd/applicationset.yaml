---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=confirm,Prune=confirm
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/kappc/platform.git
        revision: main
        files:
          - path: kubernetes/clusters/homelab/instances/*/instance.yaml
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: rollout-group
              operator: In
              values:
                - infrastructure
        - matchExpressions:
            - key: rollout-group
              operator: In
              values:
                - platform
        - matchExpressions:
            - key: rollout-group
              operator: In
              values:
                - workload
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        rollout-group: '{{ .argocd.rolloutGroup }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{ .argocd.project }}'
      sources:
        - repoURL: https://github.com/kappc/platform.git
          targetRevision: main
          path: kubernetes/catalog/{{ .application }}
          helm:
            releaseName: '{{ .path.basename }}'
            valueFiles:
              - $values/{{ .path.path }}/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/kappc/platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - Prune=true
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
  templatePatch: |
    {{- if hasKey .argocd "ignoreDifferences" }}
    spec:
      ignoreDifferences: {{ toJson .argocd.ignoreDifferences }}
    {{- end }}
