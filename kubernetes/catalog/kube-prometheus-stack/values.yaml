---
httpRoute:
  enabled: true
  listener: http
  path: /
  port: 80
  service: kube-prometheus-stack-grafana

networkPolicy:
  enabled: false

externalSecrets:
  - name: grafana-admin
    remoteKey: monitoring
    data:
      admin-user: grafana-admin-username
      admin-password: grafana-admin-password

kube-prometheus-stack:
  grafana:
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      size: 2Gi
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 6GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 8Gi
