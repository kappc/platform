---
{{- if .Values.addressPool.enabled }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.addressPool.name }}
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    {{- $err := "addressPool.addresses must contain one or more ranges" }}
    {{- $addresses := required $err .Values.addressPool.addresses }}
    {{- toYaml $addresses | nindent 4 }}
{{- end }}
