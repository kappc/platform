---
{{- if .Values.l2Advertisement.enabled }}
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.l2Advertisement.name }}
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - {{ .Values.addressPool.name }}
  interfaces:
    {{- $err := "l2Advertisement.interfaces must contain one or more interfaces" }}
    {{- $interfaces := required $err .Values.l2Advertisement.interfaces }}
    {{- toYaml $interfaces | nindent 4 }}
{{- end }}
