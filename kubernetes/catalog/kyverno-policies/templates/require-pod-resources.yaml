---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-resources
  annotations:
    policies.kyverno.io/title: Require Pod Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Require CPU and memory requests and limits so workloads can be scheduled and resource use bounded.
spec:
  admission: true
  background: true
  emitWarning: false
  rules:
    - name: validate-container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- with .Values.policies.requirePodRequestsLimits.excludedNamespaces }}
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml . | nindent 16 }}
      {{- end }}
      validate:
        allowExistingViolations: true
        failureAction: {{ .Values.policies.requirePodRequestsLimits.failureAction }}
        message: Containers must define CPU and memory requests and limits.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
      skipBackgroundRequests: true
  validationFailureAction: {{ .Values.policies.requirePodRequestsLimits.failureAction }}
