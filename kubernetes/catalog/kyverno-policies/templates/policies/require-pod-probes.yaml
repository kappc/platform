---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pod-probes
  annotations:
    policies.kyverno.io/title: Require Pod Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Pod containers must define at least one probe for lifecycle management.
spec:
  validationActions:
    - {{ .Values.customPolicies.validationFailureAction }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    - name: is-long-running-pod
      expression: object.spec.?restartPolicy.orValue('Always') == 'Always'
  validations:
    - message: Containers in long-running pods must define at least one livenessProbe, readinessProbe, or startupProbe.
      expression: >-
        object.spec.?containers.orValue([]).all(container,
          has(container.livenessProbe) || has(container.readinessProbe) || has(container.startupProbe)
        )
