---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-default-namespace
  annotations:
    policies.kyverno.io/title: Disallow Default Namespace
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Pods must not be scheduled into the default namespace.
spec:
  validationActions:
    - {{ .Values.customPolicies.validationFailureAction }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - message: Using the 'default' namespace is not allowed. Workloads must use a dedicated namespace.
      expression: object.metadata.?namespace.orValue(request.?namespace.orValue('')) != 'default'
