---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "mail-archiver.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
  selector: {{- include "mail-archiver.selectorLabels" . | nindent 4 }}
