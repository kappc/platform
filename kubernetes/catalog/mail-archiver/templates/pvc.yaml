---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-keys" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mail-archiver.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.dataProtection.size }}
