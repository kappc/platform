---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-docker" .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.dockerSize }}
