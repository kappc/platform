---
networkPolicy:
  enabled: true

externalSecrets:
  - name: gitea-runner
    data:
      token: registration-token

persistence:
  # -- Size of the volume that caches the images pulled by jobs
  dockerSize: 20Gi

actions:
  enabled: true
  # -- URL under which the runner reaches Gitea; the default is the in-cluster service of an instance named `gitea`
  giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000
  existingSecret: gitea-runner
  existingSecretKey: token
  init:
    image:
      repository: busybox
      tag: "1.38.0"
      digest: sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
  statefulset:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccountName: gitea-runner
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    persistence:
      size: 1Gi
    extraVolumes:
      - name: docker-data
        persistentVolumeClaim:
          claimName: gitea-runner-docker
    runner:
      registry: docker.io
      repository: gitea/runner
      tag: 5.3.0
      digest: sha256:cdc5336a0b0be435b6a21379edf5cccffcc6733cacd5672fcf5769716f56a768
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      config: |
        log:
          level: info
        cache:
          enabled: false
        container:
          require_docker: true
          docker_timeout: 300s
    dind:
      rootless: true
      repository: docker
      tag: 29.9.2-dind-rootless
      digest: sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
      extraVolumeMounts:
        - name: docker-data
          mountPath: /home/rootless/.local/share/docker
