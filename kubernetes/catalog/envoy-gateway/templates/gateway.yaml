---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  listeners:
    - name: {{ .Values.gateway.listener.name }}
      protocol: HTTP
      port: {{ .Values.gateway.listener.port }}
      allowedRoutes:
        {{- toYaml .Values.gateway.allowedRoutes | nindent 8 }}
    {{- if .Values.gateway.tls.enabled }}
    - name: {{ .Values.gateway.tls.listener.name }}
      protocol: HTTPS
      port: {{ .Values.gateway.tls.listener.port }}
      {{- with .Values.gateway.tls.listener.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        {{- toYaml .Values.gateway.allowedRoutes | nindent 8 }}
    {{- end }}
