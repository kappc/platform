{{- if .Values.gateway.tls.enabled }}
{{- $skipDryRun := "SkipDryRunOnMissingResource=true" }}
{{- $issuerRef := .Values.gateway.tls.certificate.issuerRef }}
{{- if not $issuerRef }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-selfsigned" .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: {{ $skipDryRun }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-ca" .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: {{ $skipDryRun }}
spec:
  isCA: true
  commonName: {{ printf "%s-ca" .Values.gateway.name }}
  secretName: {{ printf "%s-ca" .Values.gateway.name }}
  duration: 87600h
  privateKey:
    rotationPolicy: Never
  issuerRef:
    name: {{ printf "%s-selfsigned" .Values.gateway.name }}
    kind: Issuer
    group: cert-manager.io
  usages:
    - digital signature
    - cert sign
    - crl sign
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-ca" .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: {{ $skipDryRun }}
spec:
  ca:
    secretName: {{ printf "%s-ca" .Values.gateway.name }}
{{- $issuerRef = dict "name" (printf "%s-ca" .Values.gateway.name) "kind" "Issuer" "group" "cert-manager.io" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: {{ $skipDryRun }}
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  dnsNames:
    {{- $dns := required "gateway.tls.certificate.dnsNames is required" .Values.gateway.tls.certificate.dnsNames -}}
    {{- toYaml $dns | nindent 4 }}
  issuerRef:
    {{- toYaml $issuerRef | nindent 4 }}
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}
