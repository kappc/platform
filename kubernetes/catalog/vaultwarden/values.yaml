---
database:
  enabled: true
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.7"
    digest: sha256:dab846a58e8ca3c8872584ab2225ee93fb9e659a87c52e163fefae9275b46f51
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

httpRoute:
  enabled: true
  listener: https
  path: /
  port: 80

networkPolicy:
  enabled: true
  port: 8080

externalSecrets:
  - name: vaultwarden-config
    data:
      ADMIN_TOKEN: admin-token

vaultwarden:
  image:
    repository: vaultwarden/server
    tag: 1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
  commonAnnotations:
    reloader.stakater.com/auto: "true"
  podSecurityContext:
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    data:
      name: vaultwarden-data
      size: 2Gi
      accessMode: ReadWriteOnce
      keepPvc: true
  database:
    type: postgresql
    host: vaultwarden-db-rw
    port: "5432"
    dbName: vaultwarden
    existingSecret: vaultwarden-db
    enableWal: false
  adminToken:
    existingSecret: vaultwarden-config
    existingSecretKey: ADMIN_TOKEN
  signupsAllowed: false
