---
{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  {{- with .Values.secretStore.allowedNamespaces }}
  conditions:
    - namespaces: {{ . | toJson }}
  {{- end }}
  provider:
    vault:
      server: {{ printf "https://%s.%s.svc:8200" .Release.Name .Release.Namespace | quote }}
      path: secret
      version: v2
      caProvider:
        type: Secret
        namespace: {{ .Release.Namespace }}
        name: openbao-ca
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - openbao
{{- end }}
