---
policy-reporter:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  ui:
    enabled: true
    clusters:
      - name: default
        host: http://policy-reporter:8080
        plugins:
          - name: kyverno
            host: http://policy-reporter-kyverno-plugin:8080
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 64Mi
  plugin:
    kyverno:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi
