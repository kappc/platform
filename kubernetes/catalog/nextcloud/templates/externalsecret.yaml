---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-admin" .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-admin" .Release.Name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: nextcloud-username
      remoteRef:
        key: {{ .Release.Name }}
        property: admin-username
    - secretKey: nextcloud-password
      remoteRef:
        key: {{ .Release.Name }}
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-db" .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-db" .Release.Name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Release.Name }}
        property: db-username
    - secretKey: password
      remoteRef:
        key: {{ .Release.Name }}
        property: db-password
