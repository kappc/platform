{{- range $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ $es.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: {{ $es.type | default "Opaque" }}
      {{- with $es.template }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  data:
    {{- range $key, $property := $es.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.remoteKey | default $.Release.Name }}
        property: {{ $property }}
    {{- end }}
{{- end }}
