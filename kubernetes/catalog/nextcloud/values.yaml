---
database:
  enabled: true
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.7"
    digest: sha256:dab846a58e8ca3c8872584ab2225ee93fb9e659a87c52e163fefae9275b46f51
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

httpRoute:
  enabled: true
  listener: http
  path: /
  port: 8080

networkPolicy:
  enabled: true
  port: 80

externalSecrets:
  - name: nextcloud-admin
    data:
      nextcloud-username: admin-username
      nextcloud-password: admin-password

nextcloud:
  nextcloud:
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
  externalDatabase:
    enabled: true
    type: postgresql
    host: nextcloud-db-rw
    existingSecret:
      enabled: true
      secretName: nextcloud-db
      usernameKey: username
      passwordKey: password
  internalDatabase:
    enabled: false
  persistence:
    enabled: true
    size: 20Gi
  cronjob:
    enabled: true
    type: cronjob
    cronjob:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  startupProbe:
    enabled: true
    failureThreshold: 60
