---
database:
  enabled: true
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.7"
    digest: sha256:dab846a58e8ca3c8872584ab2225ee93fb9e659a87c52e163fefae9275b46f51
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

httpRoute:
  enabled: true
  listener: http
  path: /
  port: 80
  service: authentik-server

networkPolicy:
  enabled: true
  port: 9000
  allow:
    - outline

externalSecrets:
  - name: authentik-config
    data:
      AUTHENTIK_SECRET_KEY: secret-key
      AUTHENTIK_POSTGRESQL__PASSWORD: db-password
      AUTHENTIK_BOOTSTRAP_PASSWORD: bootstrap-password

authentik:
  authentik:
    existingSecret:
      secretName: authentik-config
  global:
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-db-rw
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
  server:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  worker:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
