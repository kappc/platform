---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-config" .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-config" .Release.Name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: {{ .Release.Name }}
        property: secret-key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: {{ .Release.Name }}
        property: postgres-password
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: {{ .Release.Name }}
        property: bootstrap-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-db" .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-db" .Release.Name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Release.Name }}
        property: db-username
    - secretKey: password
      remoteRef:
        key: {{ .Release.Name }}
        property: postgres-password
