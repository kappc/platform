---
database:
  enabled: true
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.7"
    digest: sha256:dab846a58e8ca3c8872584ab2225ee93fb9e659a87c52e163fefae9275b46f51
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

httpRoute:
  enabled: true
  listener: http
  path: /
  port: 3000

networkPolicy:
  enabled: true
  port: 3000

externalSecrets:
  - name: outline-config
    data:
      secret-key: secret-key
      utils-secret: utils-secret
      oidc-client-secret: oidc-client-secret
  - name: outline-redis
    data:
      redis-password: redis-password

outline:
  secretKeyExternalSecret:
    name: outline-config
    key: secret-key
  utilsSecretExternalSecret:
    name: outline-config
    key: utils-secret
  ingress:
    enabled: false
  postgresql:
    enabled: false
  externalPostgresql:
    host: outline-db-rw
    username: outline
    existingSecret: outline-db
    passwordSecretKey: password
    database: outline
  redis:
    enabled: true
    architecture: standalone
    image:
      tag: 8.2.1-debian-12-r0
      digest: sha256:25bf63f3caf75af4628c0dfcf39859ad1ac8abe135be85e99699f9637b16dc28
    auth:
      enabled: true
      existingSecret: outline-redis
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  fileStorage:
    mode: local
    local:
      persistence:
        enabled: true
        size: 8Gi
  auth:
    oidc:
      enabled: true
      clientId: outline
      existingSecret:
        name: outline-config
        clientSecretKey: oidc-client-secret
      tokenUri: http://authentik-server.authentik.svc.cluster.local:80/application/o/token/
      userInfoUri: http://authentik-server.authentik.svc.cluster.local:80/application/o/userinfo/
      displayName: Authentik
      usernameClaim: preferred_username
      scopes:
        - openid
        - profile
        - email
  web:
    forceHttps: false
  service:
    port: 3000
