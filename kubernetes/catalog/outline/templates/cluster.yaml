---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ printf "%s-db" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  imageName: {{ printf "%s:%s@%s" .Values.database.image.repository .Values.database.image.tag .Values.database.image.digest | quote }}
  bootstrap:
    initdb:
      database: {{ .Release.Name }}
      owner: {{ .Release.Name }}
  storage:
    size: {{ .Values.database.storage.size }}
    {{- with .Values.database.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
