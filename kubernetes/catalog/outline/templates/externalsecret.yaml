---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-config
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: outline-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: secret-key
      remoteRef:
        key: outline
        property: secret-key
    - secretKey: utils-secret
      remoteRef:
        key: outline
        property: utils-secret
    - secretKey: oidc-client-secret
      remoteRef:
        key: outline
        property: oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-db
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: outline-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: outline
        property: db-username
    - secretKey: password
      remoteRef:
        key: outline
        property: db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-redis
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: outline-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: redis-password
      remoteRef:
        key: outline
        property: redis-password
