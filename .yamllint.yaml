---
extends: default

ignore: |
  /kubernetes/catalog/*/templates/

rules:
  braces:
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  brackets:
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  comments-indentation: {}
  document-start:
    present: true
  indentation:
    indent-sequences: true
    spaces: 2
  line-length:
    max: 120
  trailing-spaces: {}
